<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1115;
    color: #e6e6e6;
    font-family: -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-app-region: drag;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .name { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
  .spinner {
    width: 22px; height: 22px;
    border: 2px solid #2c3140;
    border-top-color: #4d8dff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 12px; color: #9aa3b2; }
  /* Determinate bar for the download phases only; phases that can't report a
   * number hide it again, leaving the spinner to say "still working". */
  #track {
    display: none;
    width: 200px;
    height: 3px;
    border-radius: 999px;
    background: #2c3140;
    overflow: hidden;
  }
  #track.show { display: block; }
  #fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: #4d8dff;
    transition: width 0.3s;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="name">DSH</div>
    <div class="spinner"></div>
    <div id="status">正在启动…</div>
    <div id="track"><div id="fill"></div></div>
  </div>
  <script>
    // Driven by the main process (this window has no preload): a number fills
    // the bar, null hides it for phases with nothing to report.
    window.setProgress = (percent) => {
      document.getElementById('track').classList.toggle('show', percent !== null)
      if (percent !== null) document.getElementById('fill').style.width = `${percent}%`
    }
  </script>
</body>
</html>
