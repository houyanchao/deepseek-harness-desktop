<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f1115;
    color: #e6e6e6;
    font-family: -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-app-region: drag;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .name { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
  .spinner {
    width: 22px; height: 22px;
    border: 2px solid #2c3140;
    border-top-color: #4d8dff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 12px; color: #9aa3b2; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="name">DSH</div>
    <div class="spinner"></div>
    <div id="status">正在启动…</div>
  </div>
</body>
</html>
