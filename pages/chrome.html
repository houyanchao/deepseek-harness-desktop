<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font: 500 12px -apple-system, "Segoe UI", sans-serif;
    user-select: none;
  }
  /*
   * The permanent header, native-title-bar height. The drag region must be
   * ONLY this strip: window drag regions are handled natively at window
   * level, so a full-page region would swallow clicks meant for the dsh
   * view layered above the rest of this page.
   */
  .bar {
    box-sizing: border-box;
    height: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px 0 12px;
    border-bottom: 1px solid #ececec;
    -webkit-app-region: drag;
  }
  /* mac: room for the inset traffic lights (ending near x=84) plus a 10px gap. */
  body[data-platform="darwin"] .bar { padding-left: 94px; }
  /* Colors follow dsh's primary button: neutral-bluish-1000 fill, 750 hover. */
  #update {
    display: none;
    align-items: center;
    padding: 1px 10px;
    border-radius: 999px;
    border: none;
    background: rgb(15, 17, 21);
    color: #ffffff;
    font: inherit;
    font-size: 10px;
    font-weight: 400;
    line-height: 16px;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #update.show { display: inline-flex; }
  #update:hover { background: rgb(67, 69, 74); }
  /* Version switcher: ghost pill; the dropdown itself is a native menu. */
  #version {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 1px 8px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: rgb(100, 103, 112);
    font: inherit;
    font-size: 10px;
    font-weight: 400;
    line-height: 16px;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #version.show { display: inline-flex; }
  #version:hover { background: rgba(15, 17, 21, 0.07); color: rgb(15, 17, 21); }
  #version::after { content: "▾"; font-size: 8px; opacity: 0.7; }
  /* First of the right-hand group, so its auto margin pushes that whole
   * group (GitHub, then update) to the bar's right edge. */
  #github {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    padding: 0;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: rgb(100, 103, 112);
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #github:hover { background: rgba(15, 17, 21, 0.07); color: rgb(15, 17, 21); }
  #github svg { display: block; }
</style>
</head>
<body>
  <div class="bar">
    <button id="version"></button>
    <button id="github" title="在 GitHub 上查看">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </button>
    <button id="update">更新</button>
  </div>
  <script>
    document.body.dataset.platform = new URLSearchParams(location.search).get('platform') ?? ''
  </script>
</body>
</html>
